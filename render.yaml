services:
  - type: web
    runtime: docker
    name: educational-system-api-motarek66
    plan: free
    region: frankfurt
    repo: https://github.com/motarek66/Educational-System.git
    branch: main
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /api/v1/health/ready
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: educational-system-db-motarek66
          property: connectionString
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: QR_TOKEN_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 30
      - key: CORS_ORIGINS
        value: https://educational-system-motarek66.onrender.com
      - key: APP_TIMEZONE
        value: Africa/Cairo
      - key: DEFAULT_COUNTRY
        value: EG
      - key: SUPER_ADMIN_NAME
        value: Mohamed Tarek
      - key: SUPER_ADMIN_EMAIL
        value: mohamedtarek4449@gmail.com
      - key: SUPER_ADMIN_PHONE
        value: "+201000000000"
      - key: SUPER_ADMIN_PASSWORD
        sync: false

  - type: web
    runtime: static
    name: educational-system-motarek66
    repo: https://github.com/motarek66/Educational-System.git
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @edu/web build
    staticPublishPath: ./apps/web/dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://educational-system-api-motarek66.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Permissions-Policy
        value: camera=(self)
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

databases:
  - name: educational-system-db-motarek66
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
    databaseName: student_management
    user: educational_system
    ipAllowList: []
